---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-config-idp-edenlab-io-v1alpha1-keycloakclient
  failurePolicy: Fail
  name: mkeycloakclient-v1.kb.io
  rules:
  - apiGroups:
    - config.idp.edenlab.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - keycloakclients
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-config-idp-edenlab-io-v1alpha1-keycloakrealm
  failurePolicy: Fail
  name: vkeycloakrealm-v1.kb.io
  rules:
  - apiGroups:
    - config.idp.edenlab.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - keycloakrealms
  sideEffects: None
