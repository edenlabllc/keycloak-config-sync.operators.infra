---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - config.idp.edenlab.io
  resources:
  - keycloakrealms
  verbs:
  - get
  - list
  - watch
