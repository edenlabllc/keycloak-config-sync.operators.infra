kind: Role
metadata:
  name: manager-role
  namespace: keycloak
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.idp.edenlab.io
  resources:
  - keycloakauthflows
  - keycloakclients
  - keycloakcomponents
  - keycloakorganizations
  - keycloakrealms
  - keycloakscopemappings
  - keycloakusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.idp.edenlab.io
  resources:
  - keycloakauthflows/finalizers
  - keycloakclients/finalizers
  - keycloakcomponents/finalizers
  - keycloakorganizations/finalizers
  - keycloakrealms/finalizers
  - keycloakscopemappings/finalizers
  - keycloakusers/finalizers
  verbs:
  - update
- apiGroups:
  - config.idp.edenlab.io
  resources:
  - keycloakauthflows/status
  - keycloakclients/status
