apiVersion: v1.edp.edenlab.io/v1
kind: KeycloakClientScopeMapping
metadata:
  name: keycloakclientscopemapping-sample
spec:
  realmRef:
    name: keycloakrealm-sample
    kind: KeycloakRealm
  fromClient: "ehealth-portal"
  clientScope: "dispense_request_manage"
  description: "client scope mapping from client ehealth-portal to scope dispense_request_manage"
  roles:
    - name: "dispense_request_manager"
    - name: "dispense_overridder"
