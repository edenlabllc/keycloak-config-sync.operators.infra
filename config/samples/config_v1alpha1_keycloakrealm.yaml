apiVersion: config.idp.edenlab.io/v1alpha1
kind: KeycloakRealm
metadata:
  name: "realm-test"
  namespace: "keycloak"
  annotations:
    # skip resource delete
    "idp.edenlab.io/preserve-resources-no-delete": "true"
spec:
  # ID is the ID of the realm.
  id: "realm-test"

  # RealmName specifies the name of the realm.
  #
  # Validations:
  # self == oldSelf: Value is immutable
  realmName: "realm-test"

  # Configuration to Keycloak cluster
  configRef:
    # Secret is a secret name which contains admin credentials.
    secret: "keycloak-realm-test-access"

    # URL of keycloak service.
    url: "http://keycloak:8080"

  # OrganizationsEnabled enables Keycloak Organizations feature for this realm. When enabled, this realm can support Organization resources for multi-tenant scenarios, identity provider groupings, and domain-based user routing.
  # Organizations format supported Keycloak >= 25
  # Default: false
  useOrganizations: "false"

  # ReconciliationStrategy is a strategy to reconcile client.
  # enum: full;addOnly
  reconciliationStrategy: "noDelete"

  # Localization configures supported/default locales and custom message bundles (realm export field `localizationTexts`).
  localization:
    # DefaultLocale is the realm default locale tag.
    defaultLocale: "en"
    # InternationalizationEnabled enables the realm internationalization feature.
    internationalizationEnabled: "false"
    # LocalizationTexts maps locale code to message key → translated text (same shape as Keycloak `localizationTexts` in a realm export).
    localizationTexts:
      en:
        "test-code": "translation-text"
    supportedLocales:
      - "en"

  # Login settings for the realm.
  login:
    # LoginWithEmail allows users to log in with their email address.
    #
    # Default: true
    loginWithEmail: "true"

    # DuplicateEmails allows multiple users to have the same email address.
    #
    # Default: false
    duplicateEmails: "false"

    # VerifyEmail requires user to verify their email address after initial login or after address changes are submitted.
    #
    # Default: false
    verifyEmail: "true"

    # RememberMe shows checkbox on the login page to allow the user to remain logged in between browser restarts until the session expires.
    #
    # Default: false
    rememberMe: "false"

    # UserRegistration enables/disables the registration page. A link for registration will show on the login page too.
    #
    # Default: false
    userRegistration: "true"

    # EmailAsUsername allows users to set email as username.
    #
    # Default: false
    emailAsUsername: "false"

    # EditUsername allows to edit username.
    #
    # Default: false
    editUsername: "false"

    # ForgotPassword shows a link on the login page for users who have forgotten their credentials.
    #
    # Default: false
    forgotPassword: "true"

  # TokenSettings is the configuration for tokens in the realm.
  tokenSettings:
    # AccessTokenLifespanForImplicitFlow specifies max time(in seconds) before an access token is expired for implicit flow.
    #
    # Default: 900
    accessToken: "900"

    # DefaultSignatureAlgorithm specifies the default algorithm used to sign tokens for the realm
    #
    # Enum: ES256, ES384, ES512, EdDSA, HS256, HS384, HS512, PS256, PS384, PS512, RS256, RS384, RS512
    # Default: RS256
    defaultSignatureAlgorithm: "RS256"

    # RevokeRefreshToken if enabled a refresh token can only be used up to 'refreshTokenMaxReuse' and is revoked when a different token is used. Otherwise, refresh tokens are not revoked when used and can be used multiple times.
    #
    # Default: false
    revokeRefreshToken: "true"

    # RefreshTokenMaxReuse specifies maximum number of times a refresh token can be reused. When a different token is used, revocation is immediate.
    #
    # Default: 0
    refreshTokenMaxReuse: "20"

    # AccessTokenLifespan specifies max time(in seconds) before an access token is expired. This value is recommended to be short relative to the SSO timeout.
    #
    # Default: 300
    accessTokenLifespan: "36000"

    # AccessCodeLifespan specifies max time(in seconds)a client has to finish the access token protocol. This should normally be 1 minute.
    #
    # Default: 60
    accessCodeLifespan: "600"

    # ActionTokenGeneratedByAdminLifespan specifies max time(in seconds) before an action permit sent to a user by administrator is expired. This value is recommended to be long to allow administrators to send e-mails for users that are currently offline. The default timeout can be overridden immediately before issuing the token.
    #
    # Default: 43200
    actionTokenGeneratedByAdminLifespan: "43200"

    # AccessCodeLifespanUserAction specifies max time(in seconds) before an action permit sent by a user (such as a forgot password e-mail) is expired. This value is recommended to be short because it's expected that the user would react to self-created action quickly.
    #
    # Default: 300
    actionTokenGeneratedByUserLifespan: "300"

  # Sessions defines the session settings for the realm.
  sessions:
    # SSOLoginSettings defines the SSO login settings for the realm.
    ssoLoginSettings:
      # AccessCodeLifespanLogin represents the max time a user has to complete a login.
      # This is recommended to be relatively long, such as 30 minutes or more.
      #
      # Default: 1800
      accessCodeLifespanLogin: "1800"

      # AccessCodeLifespanUserAction represents the max time a user has to complete login
      # related actions like update password or configure totp. This is recommended to be relatively long, such as 5 minutes or more.
      #
      #Default: 300
      accessCodeLifespanUserAction: "300"

    # SSOSessionSettings defines the SSO session settings for the realm.
    ssoSessionSettings:
      # IdleTimeout represents the time a session is allowed to be idle before it expires.
      # Tokens and browser sessions are invalidated when a session is expired.
      #
      # Default: 1800
      idleTimeout: "86400"

      # MaxLifespan represents the max time before a session is expired.
      # Tokens and browser sessions are invalidated when a session is expired.
      #
      # Default: 36000
      maxLifespan: "259200"

      # IdleTimeoutRememberMe represents the time a session is allowed to be idle before it expires.
      # Tokens and browser sessions are invalidated when a session is expired. If not set it uses the standard ssoSessionIdle value.
      #
      # Default: 0
      idleTimeoutRememberMe: "0"

      # MaxLifespanRememberMe represents the max time before a session is expired when a user
      # has set the remember me option. Tokens and browser sessions are invalidated when a session is expired.
      # If not set it uses the standard ssoSessionMax value.
      #
      # Default: 0
      maxLifespanRememberMe: "0"

    # SSOOfflineSessionSettings defines the SSO offline session settings for the realm.
    ssoOfflineSessionSettings:
      # IdleTimeout represents the time an offline session is allowed to be idle before it expires.
      # You need to use offline token to refresh at least once within this period; otherwise offline session will expire.
      #
      # Default: 2592000
      idleTimeout: "2592000"

      # MaxLifespan represents the max time before an offline session is expired regardless of activity.
      #
      # Default: 5184000
      maxLifespan: "5184000"

      # MaxLifespanEnabled enables the offline session maximum lifetime.
      #
      # Default: false
      maxLifespanEnabled: "false"

  # BrowserSecurityHeaders is a map of security headers to apply to HTTP responses from the realm's browser clients.
  browserSecurityHeaders:
    contentSecurityPolicyReportOnly: ""
    xContentTypeOptions: "nosniff"
    referrerPolicy: "no-referrer"
    xRobotsTag: "none"
    xFrameOptions: "SAMEORIGIN"
    contentSecurityPolicy: "frame-src 'self'; frame-ancestors 'self'; object-src 'none';"
    xXSSProtection: "1; mode=block"
    strictTransportSecurity: "max-age=31536000; includeSubDomains"

  # Themes is a map of themes to apply to the realm.
  themes:
    # AccountTheme specifies the account theme to use for the realm.
    accountTheme: "custom-theme"
    # LoginTheme specifies the login theme to use for the realm.
    loginTheme: "custom-theme"
    # EmailTheme specifies the email theme to use for the realm.
    emailTheme: ""
    # AdminConsoleTheme specifies the admin console theme to use for the realm.
    adminConsoleTheme: ""
    # InternationalizationEnabled indicates whether to enable internationalization.
    # Deprecated: use spec.localization.internationalizationEnabled instead.
    # This field duplicates that setting and will be removed in a future API version. If both are set, spec.localization wins.
    internationalizationEnabled: "false"

  # DisplayHTMLName name to render in the UI
  displayHtmlName: ""

  # DisplayName is the display name of the realm.
  displayName: ""

  # BrowserFlow specifies the authentication flow to use for the realm's browser clients.
  browserFlow: "browser"
  #  authenticationFlows: # not allowed V1
  #    browserFlow: "browser"

  # User profile configuration
  # NOTE: commented out — operator unconditionally sends 'multivalued' field
  # which is not supported by Keycloak 23.0.4 (added in Keycloak 24+).
  # Configure user profile attributes directly via Keycloak Admin UI or API.
  # userProfileConfig: ...

  # RealmEventConfig is the configuration for events in the realm.
  realmEventConfig:
    # EventsEnabled indicates whether to enable events.
    eventsEnabled: "true"

    # AdminEventsEnabled indicates whether to enable admin events.
    adminEventsEnabled: "true"

    # AdminEventsDetailsEnabled indicates whether to enable detailed admin events.
    adminEventsDetailsEnabled: "true"

    # AdminEventsExpiration sets the expiration for events in seconds. Expired events are periodically deleted from the database.
    adminEventsExpiration: "2592000"

    # EventsExpiration is the number of seconds after which events expire.
    eventsExpiration: "0"

    # EventsListeners is a list of event listeners to enable.
    eventsListeners:
      - "jboss-logging"

    # EnabledEventTypes is a list of event types to enable.
    enabledEventTypes:
      - "VERIFY_EMAIL"

  # Smtp is the configuration for email in the realm.
  smtp:
    # Connection specifies the email connection configuration.
    connection:
      # Host specifies the email server host.
      host: "smtp-relay.com"

      # Port specifies the email server port.
      #
      # Default: 25
      port: "587"

      # EnableSSL specifies if SSL is enabled.
      enableSSL: "false"

      # EnableStartTLS specifies if StartTLS is enabled.
      enableStartTLS: "false"

      # Authentication specifies the email authentication configuration.
      authentication:
        # Username specifies login username.
        username:
          # Selects a key of a secret.
          secretKeyRef:
            # The key of the secret to select from.
            key: ""
            # Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
            #
            # Default: ""
            name: ""
          # Selects a key of a ConfigMap.
          configMapKeyRef:
            # The key to select.
            key: ""
            # Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
            #
            # Default: ""
            name: ""
          # Directly specifies a value.
          value: "12345678@smtp.com"
        # Password specifies login password.
        password:
          # Selects a key of a ConfigMap.
          configMapKeyRef:
            # The key to select.
            key: ""
            # Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
            #
            # Default: ""
            name: ""
          # Selects a key of a secret.
          secretKeyRef:
            # Name of the referent. This field is effectively required, but due to backwards compatibility is allowed to be empty. Instances of this type with an empty value here are almost certainly wrong. More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
            #
            # Default: ""
            name: "realm-test-smtp-secret"
            # The key of the secret to select from.
            key: "password"
    # Template specifies the email template configuration.
    template:
      # From specifies the sender email address.
      from: "test@domain.com.ua"

      # ReplyToDisplayName specifies display name for reply-to email address.
      fromDisplayName: "realm-test-develop"

      # ReplyTo specifies the reply-to email address.
      replyTo: ""

      # FromDisplayName specifies the sender display for sender email address.
      replyToDisplayName: ""

      # EnvelopeFrom is an email address used for bounces.
      envelopeFrom: ""

  # WebAuthnPolicySettings and the WebAuthn Passwordless Policy.
  # These policies define how Keycloak interacts with security keys and passkeys during registration and authentication.
  webAuthnPolicySettings:
    # Human-readable name displayed by authenticators during registration.
    rpEntityName: "keycloak"

    # Allowed cryptographic algorithms for credential creation and authentication.
    # Common values: ES256, ES384, ES512, RS256, RS384, RS512.
    signatureAlgorithms:
      - "ES256"

    # Relying Party ID. Usually the domain name of the Keycloak instance.
    # Empty value means Keycloak determines it automatically.
    rpId: ""

    # Attestation preference requested from the authenticator.
    # Valid values: "none", "indirect", "direct", "enterprise", "not specified".
    attestationConveyancePreference: "not specified"

    # Restricts authenticator type.
    # Valid values: "platform", "cross-platform", "not specified".
    authenticatorAttachment: "not specified"

    # Controls whether resident/discoverable credentials are required.
    # Valid values: "yes", "no", "not specified".
    requireResidentKey: "not specified"

    # User verification requirement.
    # Valid values: "required", "preferred", "discouraged", "not specified".
    userVerificationRequirement: "not specified"

    # Timeout (milliseconds) for credential creation ceremony.
    # 0 uses the browser/authenticator default.
    createTimeout: "0"

    # Prevent registration of the same authenticator multiple times.
    avoidSameAuthenticatorRegister: "false"

    # Human-readable relying party name for passwordless authentication.
    passwordlessRpEntityName: "keycloak"

    # Allowed signature algorithms for passwordless credentials.
    passwordlessSignatureAlgorithms:
      - "ES256"

    # Relying Party ID for passwordless authentication.
    # Empty value means Keycloak determines it automatically.
    passwordlessRpId: ""

    # Attestation preference for passwordless credential registration.
    passwordlessAttestationConveyancePreference: "not specified"

    # Restricts passwordless authenticator type.
    passwordlessAuthenticatorAttachment: "not specified"

    # Controls whether discoverable credentials are required for passwordless login.
    passwordlessRequireResidentKey: "not specified"

    # User verification requirement for passwordless authentication.
    passwordlessUserVerificationRequirement: "not specified"

    # Timeout (milliseconds) for passwordless credential creation.
    # 0 uses the browser/authenticator default.
    passwordlessCreateTimeout: "0"

    # Prevent registration of the same passwordless authenticator multiple times.
    passwordlessAvoidSameAuthenticatorRegister: "false"

  # To configure Keycloak for the OAuth 2.0 Device Authorization Grant (often used for devices with limited input/browsers, like TVs or hardware encoders), you must enable the feature and then configure it both globally (or at the realm level) and per-client.
  oauth2DeviceSettings:
    # # Lifetime of the device authorization code in seconds.
    #  # The user must complete authorization before this code expires.
    codeLifespan: "600"

    # Minimum interval (seconds) that clients must wait between
    # polling requests to the token endpoint.
    pollingInterval: "5"

  # sslRequired is a realm-level configuration that determines
  # whether users must connect via HTTPS to interact with that specific realm.
  sslRequired: "external"

  # Brute force protection in keycloak
  bruteForceProtected: "false"

  # permanentLockout is a security feature within the Brute Force Detection
  # policy that disables a user account indefinitely after a specified number of failed login attempts.
  permanentLockout: "false"

  # maxFailureWaitSeconds is a Keycloak realm configuration property
  # that defines the maximum duration (in seconds) a user is temporarily locked out after exceeding
  # the allowed number of consecutive failed login attempts.
  maxFailureWaitSeconds: "900"

  # minimumQuickLoginWaitSeconds is a parameter within the Brute Force Detection policy.
  # It defines the minimum duration in seconds a user must wait before attempting to log
  # in again after a recent quick sequence of failed login attempts.
  minimumQuickLoginWaitSeconds: "60"

  # waitIncrementSeconds is a parameter used in the Brute Force Detection policy.
  # It defines the number of seconds the lockout duration increases each time a user
  # fails consecutive login attempts, after exceeding the failureFactor threshold.
  waitIncrementSeconds: "60"

  # quickLoginCheckMilliSeconds is a Keycloak brute force detection setting
  # that determines the minimum allowed time between failed login attempts.
  # If a user makes multiple failed attempts quicker than this threshold,
  # Keycloak temporarily disables the account to prevent automated brute-force attacks
  quickLoginCheckMilliSeconds: "1000"

  # maxDeltaTimeSeconds s a Keycloak brute force detection setting
  maxDeltaTimeSeconds: "43200"

  # failureFactor is a configuration setting used within
  # Brute Force Detection to control how the system increases wait times (lockout durations)
  # after a user exceeds the maximum number of allowed login failures.
  failureFactor: "30"

  # A Keycloak registration flow is a sequence of steps that a user must complete to create a new account in a realm.
  registrationFlow: "registration"

  # The directGrantFlow allows an application to exchange a user's credentials (username and password) directly for an access token.
  directGrantFlow: "direct grant"

  # The resetCredentialsFlow is the sequence of steps a user follows
  # after clicking the "Forgot Password?" link on the login page.
  # It allows users to regain access by resetting their password and, if configured, their multi-factor authentication (MFA/OTP).
  resetCredentialsFlow: "reset credentials"

  # clientAuthenticationFlow are structured sequences of steps
  # that determine how a user or application is verified before receiving a token.
  # Depending on whether a human user or a machine is authenticating, different OIDC (OpenID Connect) flows are used.
  clientAuthenticationFlow: "clients"

  # The dockerAuthenticationFlow within a Docker environment typically
  # refers to one of two scenarios: the standard OpenID Connect (OIDC) flow for securing applications
  # or a specialized Docker Registry v2 authentication flow that allows Keycloak to act as an auth server for Docker registries.
  dockerAuthenticationFlow: "docker auth"

  # The userManagedAccessAllowed is a setting within
  # Authorization Services that enables the User-Managed Access (UMA) 2.0 protocol for a specific resource.
  userManagedAccessAllowed: "false"

  # keycloak attributes are custom key-value pairs used to store extra information about users, groups, or clients.
  # They are commonly used to include specific data—like an employee ID or department—within security tokens.
  attributes:
    cibaBackchannelTokenDeliveryMode: "poll"
    cibaAuthRequestedUserHint: "login_hint"
    clientOfflineSessionMaxLifespan: "0"
    oauth2DevicePollingInterval: "5"
    clientSessionIdleTimeout: "0"
    actionTokenGeneratedByUserLifespan-execute-actions: ""
    userProfileEnabled: "true"
    actionTokenGeneratedByUserLifespan-verify-email: ""
    clientOfflineSessionIdleTimeout: "0"
    actionTokenGeneratedByUserLifespan-reset-credentials: ""
    cibaInterval: "5"
    realmReusableOtpCode: "false"
    cibaExpiresIn: "120"
    oauth2DeviceCodeLifespan: "600"
    actionTokenGeneratedByUserLifespan-idp-verify-account-via-email: ""
    parRequestUriLifespan: "60"
    clientSessionMaxLifespan: "0"
    adminEventsExpiration: "432000"
    shortVerificationUri: ""

  # otpPolicySettings - Keycloak OTP (One-Time Password) policy settings control the behavior and security requirements for multi-factor authentication (MFA) within a realm.
  otpPolicySettings:
    # HMAC algorithm used for OTP generation.
    # Valid values: HmacSHA1, HmacSHA256, HmacSHA512.
    algorithm: "HmacSHA1"

    # Allow reuse of the same OTP code within its validity period.
    codeReusable: "false"

    # Number of digits in generated OTP codes.
    digits: "6"

    # Initial counter value for HOTP.
    # Ignored when type is "totp".
    initialCounter: "0"

    # Number of adjacent OTP values accepted to compensate
    # for clock drift or counter synchronization issues.
    lookAheadWindow: "1"

    # Validity period of a TOTP code in seconds.
    # Ignored when type is "hotp".
    period: "30"

    # OTP type.
    # Valid values: "totp", "hotp".
    type: "totp"

    # Authenticator applications recommended to users.
    supportedApplications:
      - "totpAppFreeOTPName"
      - "totpAppGoogleName"
      - "totpAppMicrosoftAuthenticatorName"

  # clientSessionSettings - In Keycloak, client-specific session settings allow you to override realm-level defaults for more granular control over individual application lifetimes.
  clientSessionSettings:
    # Maximum inactivity period for authenticated client sessions.
    # 0 means the realm default is used.
    idleTimeout: "0"

    # Maximum lifespan of authenticated client sessions.
    # 0 means the realm default is used.
    maxLifespan: "0"

    # Maximum inactivity period for offline sessions.
    # 0 means the realm default is used.
    offlineIdleTimeout: "0"

    # Maximum lifespan of offline sessions.
    # 0 means the realm default is used.
    offlineMaxLifespan: "0"

  # # In Keycloak, defaultRole are roles automatically assigned to all newly created or imported users.
  # By default, Keycloak assigns the composite role default-roles-{realm_name} to all users.
  # Any roles added as composites to this role become default.
  defaultRole:
    # Name of the realm's default role.
    # Automatically assigned to new users.
    name: "default-roles-realm-test"

    # Human-readable description of the default role.
    description: "${role_default-roles}"

    # Indicates whether the role is composite
    # (contains other realm or client roles).
    composite: "true"

    # Realm identifier that owns this role.
    containerId: "realm-test"

  # The requiredCredentials concept at the realm level is deprecated.
  # It was historically used to define the types of credentials (e.g., passwords or OTP) required to authenticate users in a realm.
  requiredCredentials:
    - "password"

  roles:
      # Name of keycloak role.
    - name: "viewer"

      # Description is a role description.
      description: "viewer"

      # Composite is a flag if role is composite.
      composite: "false"

      # Attributes is a map of role attributes.
      # type: map[string][]string
      attributes:
       key:
        - "go"

      # IsDefault is a flag if role is default.
      isDefault: "false"

      # Composites is a list of composites roles assigned to role.
      composites:
        - name: ""

      # CompositesClientRoles is a map of composites client roles assigned to role.
      compositesClientRoles:
        test:
          - name: ""

  groups:
      # Name of keycloak group.
    - name: "parent-test-group-1"

      # Description is a group description.
      description: "parent-test-group-1"

      # Path is a group path.
      path: ""

      # RealmRoles is a list of realm roles assigned to group.
      realmRoles: []

      # SubGroups is a list of subgroups assigned to group.
      subGroups: []

      # Attributes is a map of group attributes.
      attributes:
        "attr_1": []

      # ClientRoles is a list of client roles assigned to group.
      clientRoles:
          # ClientID is a client ID.
        - clientId: ""
          # Roles is a list of client roles names assigned to user.
          roles: []

      # Name of keycloak group.
    - name: "child-test-group-1"

      # Description is a group description.
      description: "test-group-1"

      # ParentGroup is a reference to a parent KeycloakRealmGroup custom resource.
      # If specified, this group will be created as a child group of the referenced parent.
      # The parent KeycloakRealmGroup must exist in the same namespace.
      parentGroup:
        name: "parent-test-group-1"

  identityProviders:
      # Alias is a alias of identity provider.
    - alias: "test-org-idp"

      # Enabled is a flag to enable/disable identity provider.
      enabled: "true"

      # ProviderID is a provider ID of identity provider.
      providerId: "github"

      # AddReadTokenRoleOnCreate is a flag to add read token role on create.
      addReadTokenRoleOnCreate: "false"

      # AdminFineGrainedPermissionsEnabled enable/disable fine-grained admin permissions for an identity provider.
      # Feature flag admin-fine-grained-authz:v1 should be enabled in Keycloak server.
      # Important: FGAP:V1 Keycloak feature remains in preview and may be deprecated and removed in a future releases.
      adminFineGrainedPermissionsEnabled: "false"

      # AuthenticateByDefault is a flag to authenticate by default.
      authenticateByDefault: "false"

      # DisplayName is a display name of identity provider.
      displayName: ""

      # FirstBrokerLoginFlowAlias is a first broker login flow alias.
      firstBrokerLoginFlowAlias: ""

      # HideOnLogin is a flag to hide the idp from the login page.
      # If hidden, login with this provider is possible only if requested explicitly,
      # for example using the 'kc_idp_hint' parameter.
      hideOnLogin: "false"

      # LinkOnly is a flag to link only.
      linkOnly: "false"

      # Mappers is a list of identity provider mappers.
      mappers:
          # Name is a name of identity provider mapper.
        - name: ""

          # IdentityProviderAlias is a identity provider alias.
          identityProviderAlias: ""

          # IdentityProviderMapper is a identity provider mapper.
          identityProviderMapper: ""

          # Config is a map of identity provider mapper configuration.
          config:
            "key": "value"

      # Permission is a identity provider permissions configuration
      permission:
        # ScopePermissions mapping of scope and the policies attached
        scopePermissions:
          - name: ""
            policies: []

      # PostBrokerLoginFlowAlias is a post broker login flow alias.
      postBrokerLoginFlowAlias: ""

      # StoreToken is a flag to store token.
      storeToken: "false"

      # TrustEmail is a flag to trust email.
      trustEmail: "false"

      # Config is a map of identity provider configuration.
      # Map key is a name of configuration property, map value is a value of configuration property.
      # Any value can be a reference to k8s secret, in this case value should be in format $secretName:secretKey.
      config:
        clientId: "test-org-client-id"
        clientSecret: "test-org-client-secret"
        kc.org.domain: "example.com"
        kc.org.broker.redirect.mode.email-matches: "true"
